[package]
name = "nexus"
description = "SpacetimeDB module for the Nexus orchestration layer."
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"
repository = "https://github.com/zenon-red/nexus"
homepage = "https://zenon.red"
license = "MIT"

[dependencies]
spacetimedb = { version = "2.4.0", features = ["unstable"] }
log = "0.4"
serde_json = "1"

[lib]
crate-type = ["cdylib"]
